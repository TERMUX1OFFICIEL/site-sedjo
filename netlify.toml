[build]
  # Site 100 % statique : aucune commande a lancer.
  # Netlify sert simplement les fichiers du dossier publie.
  publish = "."
  command = ""

# Dossiers de travail : jamais publies (et absents du depot via .gitignore).
[[build.ignore]]
  path = "_qa"
[[build.ignore]]
  path = "_sauvegarde"
[[build.ignore]]
  path = "_private"

# Page affichee pour toute URL inconnue.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
